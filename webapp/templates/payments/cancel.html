{% extends "core/base.html" %}
{% load static %}

{% block title %}Payment Cancelled | Guardian Agent{% endblock %}

{% block content %}
<section class="dashboard-section pt-5">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="settings-card text-center">
                    <div class="mb-4" style="width:72px;height:72px;border-radius:50%;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto;">
                        <i class="fas fa-xmark" style="color:#f59e0b;font-size:1.75rem;"></i>
                    </div>
                    <h2 class="fw-bold text-white mb-2" style="letter-spacing:-0.02em;">Payment cancelled</h2>
                    <p class="text-muted mb-4">No worries — your payment was cancelled and you have not been charged.</p>

                    <div class="d-flex gap-3 justify-content-center">
                        {% if plan %}
                        <a href="{% url 'create_checkout_session' plan.id %}" class="btn btn-primary px-4">
                            <i class="fas fa-redo me-2" style="font-size:0.8rem;"></i>Try Again
                        </a>
                        {% endif %}
                        <a href="{% url 'landing' %}#pricing" class="btn btn-outline-light px-4">
                            View Plans
                        </a>
                        <a href="{% url 'settings' %}" class="btn btn-outline-light px-4">
                            Settings
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
